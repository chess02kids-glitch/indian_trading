[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-india"
version = "0.1.0"
description = "Production repository foundation for Indian Trading"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance>=0.2.0",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pandera>=0.18.0",
    "supabase>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "mlflow>=2.15,<4.0",
    "numpy>=1.26,<3.0",
    "vectorbt>=0.26,<1.0",
    "cryptography>=41.0.0"
]

[project.scripts]
quant-india = "main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "pre-commit"
]

[tool.setuptools]
packages = ["config", "ingestion", "research", "models", "backtest", "portfolio", "agents", "risk_kill", "execution", "reconciliation", "orchestration", "observability", "dashboard", "reports", "auth"]
py-modules = ["main"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
